name: Sync Game Data & Auto-detect Points

permissions:
  contents: write

on:
  schedule:
    # Run every morning at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      sync_submodules:
        description: "Update git submodules from remote HEADs"
        required: true
        default: true
        type: boolean
      sync_j1mbob:
        description: "Pull card fixes from J1mBob/xwing-data2"
        required: false
        default: false
        type: boolean
      sync_yasb:
        description: "Patch latest points & loadouts from YASB (Raithos)"
        required: false
        default: false
        type: boolean
      sync_legacy:
        description: "Pull updates from Darker333/xwing-data2-legacy"
        required: false
        default: false
        type: boolean
      detect_points:
        description: "Auto-detect points updates and bump points_history"
        required: true
        default: true
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Game Data Sync & Points Detection
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--sync-submodules --detect-points"
          else
            if [ "${{ inputs.sync_submodules }}" = "true" ]; then ARGS="$ARGS --sync-submodules"; else ARGS="$ARGS --no-submodules"; fi
            if [ "${{ inputs.sync_j1mbob }}" = "true" ]; then ARGS="$ARGS --sync-j1mbob"; fi
            if [ "${{ inputs.sync_yasb }}" = "true" ]; then ARGS="$ARGS --sync-yasb"; fi
            if [ "${{ inputs.sync_legacy }}" = "true" ]; then ARGS="$ARGS --sync-legacy"; fi
            if [ "${{ inputs.detect_points }}" = "true" ]; then ARGS="$ARGS --detect-points"; fi
          fi

          echo "Executing: python3 scripts/sync_data.py $ARGS"
          python3 scripts/sync_data.py $ARGS

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add xwing-data2 xwing-data2-legacy points_history

          if git diff --cached --quiet; then
            echo "No game data or points changes detected. Everything is up to date."
            exit 0
          fi

          git commit -m "chore(data): auto-sync game data and points history [skip ci]"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push origin "$BRANCH" || echo "Push failed (check branch permissions)"
